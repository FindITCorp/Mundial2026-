name: Probe Sofascore RapidAPI

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'RapidAPI Key'
        required: false
        type: string
      team_name:
        description: 'Selección a buscar (default: Brazil)'
        required: false
        default: 'Brazil'
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: Probe Sofascore RapidAPI hosts and endpoints
        continue-on-error: true
        env:
          INPUT_API_KEY: ${{ github.event.inputs.api_key }}
          SECRET_API_KEY: ${{ secrets.SOFASCORE_RAPIDAPI_KEY }}
          TEAM_NAME: ${{ github.event.inputs.team_name }}
        run: |
          python3 scripts/probe_sofascore.py

      - name: Push results to repo
        if: always()
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add scripts/sofascore_probe_results.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: sofascore rapidapi probe results"
          git push origin main || true