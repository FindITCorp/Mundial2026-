name: Update WC2026 Data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/setup_db.py'
      - 'pipelines/**'
      - '.github/workflows/fetch_data.yml'
  schedule:
    - cron: '0 6 * * 1'       # Lunes 6am UTC: actualización completa (scope=all)
    - cron: '0 7 * * *'       # Diario 7am UTC: forma reciente (scope=form, o all el lunes)
    - cron: '0 0 * * *'       # Diario 0am UTC modo torneo Jun-Jul (scope detectado auto)
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope (dejar vacío = automático)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - all
          - squads
          - stats
          - form
          - lineups
          - wc

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p data/cache/api_football data/cache/football_data_org
          mkdir -p data/cache/players data/cache/teams data/cache/predictions
          mkdir -p data/logs data/lineups

      - name: Setup database
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/setup_db.py

      - name: Determine scope automatically
        id: scope
        run: |
          python - <<'PYEOF'
          import sqlite3, os
          from pathlib import Path
          from datetime import datetime

          # 1. If manually specified, use that
          manual = "${{ github.event.inputs.scope }}".strip()
          if manual:
              print(f"scope={manual}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"scope={manual}\n")
              exit(0)

          # 2. Check if DB has real data (bootstrap detection)
          db = Path("data/mundial2026.db")
          needs_bootstrap = True
          if db.exists():
              try:
                  conn = sqlite3.connect(db)
                  stats = conn.execute("SELECT COUNT(*) FROM player_club_stats").fetchone()[0]
                  nat   = conn.execute("SELECT COUNT(*) FROM player_nat_stats").fetchone()[0]
                  form  = conn.execute("SELECT COUNT(*) FROM team_matches").fetchone()[0]
                  conn.close()
                  # Has real data if any of these > seed values
                  needs_bootstrap = (stats == 0 and nat == 0 and form <= 100)
              except Exception:
                  needs_bootstrap = True

          if needs_bootstrap:
              scope = "all"
              print("Bootstrap detected: DB has no real data -> running scope=all")
          else:
              now   = datetime.utcnow()
              month = now.month
              dow   = now.weekday()  # 0=Monday
              if month in (6, 7):
                  scope = "wc"
              elif dow == 0:
                  scope = "all"
              else:
                  scope = "form"

          print(f"Auto-selected scope: {scope}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"scope={scope}\n")
          PYEOF

      - name: Run data update pipeline
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          echo "=== Running scope: ${{ steps.scope.outputs.scope }} ==="
          python pipelines/full_update.py --scope "${{ steps.scope.outputs.scope }}"

      - name: Fetch Football Prediction signals
        env:
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python pipelines/fetch_predictions.py || echo "Predictions done"

      - name: DB Summary
        run: |
          python - <<'EOF'
          import sqlite3
          from pathlib import Path
          db = Path("data/mundial2026.db")
          if not db.exists():
              print("DB not found"); exit()
          conn = sqlite3.connect(db)
          tables = ["teams","players","team_matches","player_club_stats",
                    "player_nat_stats","player_ratings","squad_selections","match_lineups"]
          print("\n=== DB Summary ===")
          for t in tables:
              try:
                  c = conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                  print(f"  {t:<25}: {c:>6}")
              except Exception:
                  pass
          conn.close()
          EOF

      - name: Commit and push updated data
        run: |
          git config user.name "mundial-bot"
          git config user.email "bot@mundial2026.local"
          git add data/mundial2026.db data/cache/ data/logs/ data/lineups/ || true
          git diff --staged --quiet || git commit -m "data: auto-update [${{ steps.scope.outputs.scope }}] $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin main || echo "Nothing new to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
