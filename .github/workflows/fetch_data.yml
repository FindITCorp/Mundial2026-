name: Fetch World Cup Data

on:
  workflow_dispatch:          # Manual trigger
  schedule:
    - cron: '0 6 * * *'       # Daily 6am UTC (during tournament)

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup database
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/setup_db.py

      - name: Fetch teams
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python pipelines/fetch_teams.py

      - name: Fetch team match history (last 3 years)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python pipelines/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "mundial-bot"
          git config user.email "bot@mundial2026"
          git add data/processed/ data/static/ data/cache/ || true
          git diff --staged --quiet || git commit -m "chore: auto-update match data $(date +'%Y-%m-%d')"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
