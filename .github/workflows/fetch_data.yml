name: Update WC2026 Data

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to update: all / squads / stats / form / lineups / wc'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - squads
          - stats
          - form
          - lineups
          - wc
  schedule:
    # Pre-torneo: actualización completa cada lunes 6am UTC
    - cron: '0 6 * * 1'
    # Pre-torneo: forma reciente cada día 7am UTC
    - cron: '0 7 * * *'
    # Durante el torneo (jun 11 - jul 19): cada 6 horas
    - cron: '0 */6 * 6,7 *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p data/cache/api_football
          mkdir -p data/cache/football_data_org
          mkdir -p data/cache/players
          mkdir -p data/cache/teams
          mkdir -p data/logs
          mkdir -p data/lineups

      - name: Setup database
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/setup_db.py

      - name: Determine scope automatically
        id: scope
        run: |
          # Manual trigger: use selected scope
          # Scheduled Monday: run "all" (full refresh)
          # Scheduled daily: run "form" + "squads"
          # Scheduled during tournament (every 6h): run "wc" + "lineups"
          if [ -n "${{ github.event.inputs.scope }}" ]; then
            SCOPE="${{ github.event.inputs.scope }}"
          else
            DOW=$(date +%u)   # 1=Monday
            MONTH=$(date +%-m)
            # June (6) or July (7) = tournament mode
            if [ "$MONTH" = "6" ] || [ "$MONTH" = "7" ]; then
              SCOPE="wc"
            elif [ "$DOW" = "1" ]; then
              SCOPE="all"
            else
              SCOPE="form"
            fi
          fi
          echo "scope=$SCOPE" >> $GITHUB_OUTPUT
          echo "Auto-selected scope: $SCOPE"

      - name: Run data update pipeline
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          echo "Running with scope: ${{ steps.scope.outputs.scope }}"
          python pipelines/full_update.py --scope "${{ steps.scope.outputs.scope }}"

      - name: Fetch squads update (on full runs)
        if: steps.scope.outputs.scope == 'all' || steps.scope.outputs.scope == 'squads'
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python pipelines/full_update.py --scope squads || echo "Squads step done"

      - name: Fetch Football Prediction API signals
        env:
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python pipelines/fetch_predictions.py || echo "Predictions step done"

      - name: Show update summary
        run: |
          python - <<'EOF'
          import sqlite3
          from pathlib import Path
          db = Path("data/mundial2026.db")
          if db.exists():
              conn = sqlite3.connect(db)
              tables = ["teams", "players", "team_matches", "wc_matches",
                        "player_club_stats", "player_nat_stats",
                        "player_ratings", "squad_selections", "match_lineups"]
              print("\n=== DB Summary ===")
              for t in tables:
                  try:
                      c = conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                      print(f"  {t:<25}: {c}")
                  except Exception:
                      pass
              conn.close()
          EOF

      - name: Commit and push updated data
        run: |
          git config user.name "mundial-bot"
          git config user.email "bot@mundial2026.local"
          git add data/mundial2026.db data/cache/ data/logs/ data/lineups/ || true
          git diff --staged --quiet || git commit -m "chore: auto-update [${{ steps.scope.outputs.scope }}] $(date +'%Y-%m-%d %H:%M UTC')"
          git push origin main || echo "Nothing new to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
