name: Update WC2026 Data

# ──────────────────────────────────────────────────────────────────────────────
# Requiere estos GitHub Secrets (Settings → Secrets → Actions):
#   FOOTBALL_DATA_KEY  → football-data.org free key
#   APIFOOT            → RapidAPI key para api-football.com
#   APISPORTS_KEY      → api-sports.io direct key
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'scripts/setup_db.py'
      - 'pipelines/**'
      - '.github/workflows/fetch_data.yml'
  schedule:
    - cron: '0 6 * * 1'       # Lunes 6am UTC: actualización completa (scope=all)
    - cron: '0 7 * * *'       # Diario 7am UTC: forma reciente (scope=form)
    - cron: '0 8 * * 3'       # Miércoles 8am UTC: alineaciones amistosos pre-torneo
    - cron: '0 0,12 * 6,7 *'  # Jun-Jul (torneo): 2 veces/día 0am y 12pm UTC
  workflow_dispatch:
    inputs:
      scope:
        description: 'Scope de actualización'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - all
          - squads
          - stats
          - form
          - lineups
          - wc
          - historical
          - lineups_friendlies
          - probe
          - diagnose
          - today_fixtures
          - predict_pairs

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p data/cache/api_football data/cache/football_data_org
          mkdir -p data/cache/players data/cache/teams data/cache/predictions
          mkdir -p data/logs data/lineups

      - name: Setup database
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/setup_db.py

      - name: Determine scope automatically
        id: scope
        run: |
          python - <<'PYEOF'
          import sqlite3, os
          from pathlib import Path
          from datetime import datetime

          manual = "${{ github.event.inputs.scope }}".strip()
          if manual:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"scope={manual}\n")
              print(f"Scope manual: {manual}")
              exit(0)

          db = Path("data/mundial2026.db")
          needs_bootstrap = True
          if db.exists():
              try:
                  conn = sqlite3.connect(db)
                  stats = conn.execute("SELECT COUNT(*) FROM player_club_stats").fetchone()[0]
                  nat   = conn.execute("SELECT COUNT(*) FROM player_nat_stats").fetchone()[0]
                  form  = conn.execute("SELECT COUNT(*) FROM team_matches").fetchone()[0]
                  conn.close()
                  needs_bootstrap = (stats == 0 and nat == 0 and form <= 100)
              except Exception:
                  needs_bootstrap = True

          if needs_bootstrap:
              scope = "all"
              print("Bootstrap: DB sin datos reales -> scope=all")
          else:
              now   = datetime.utcnow()
              month = now.month
              dow   = now.weekday()  # 0=Monday

              try:
                  conn2 = sqlite3.connect(db)
                  mp_count = conn2.execute("SELECT COUNT(*) FROM match_players").fetchone()[0]
                  conn2.close()
              except Exception:
                  mp_count = 0

              try:
                  conn3 = sqlite3.connect(db)
                  pmu_count = conn3.execute("SELECT COUNT(DISTINCT team_id) FROM player_match_usage WHERE is_starter=1").fetchone()[0]
                  conn3.close()
              except Exception:
                  pmu_count = 0

              if mp_count < 100:
                  scope = "historical"
                  print(f"Datos históricos escasos ({mp_count}) -> scope=historical")
              elif month in (6, 7):
                  scope = "wc"
                  print("Torneo en curso (Jun/Jul) -> scope=wc")
              elif dow == 0:
                  scope = "all"
                  print("Lunes -> scope=all (actualización completa)")
              elif dow == 2 and pmu_count < 40:
                  scope = "lineups_friendlies"
                  print(f"Miércoles + pocos equipos con usage ({pmu_count}/48) -> scope=lineups_friendlies")
              else:
                  scope = "form"
                  print(f"Día {dow} -> scope=form")

          print(f"Scope seleccionado: {scope}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"scope={scope}\n")
          PYEOF

      - name: Verificar API keys disponibles
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          python - <<'EOF'
          import os
          keys = {
              "FOOTBALL_DATA_KEY": os.getenv("FOOTBALL_DATA_KEY",""),
              "APIFOOT":           os.getenv("APIFOOT",""),
              "APISPORTS_KEY":     os.getenv("APISPORTS_KEY",""),
          }
          for name, val in keys.items():
              status = "✅ configurado" if val else "❌ FALTA"
              print(f"  {name}: {status}")
          if not any(keys.values()):
              print("\n⚠️  Sin ninguna API key — los pipelines usarán datos en caché")
          EOF

      - name: Ejecutar pipeline de datos
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          echo "=== Scope: ${{ steps.scope.outputs.scope }} ==="
          python pipelines/full_update.py --scope "${{ steps.scope.outputs.scope }}"

      - name: Actualizar señales de predicción
        env:
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python pipelines/fetch_predictions.py || echo "fetch_predictions finalizado"

      - name: Resumen de la DB
        run: |
          python - <<'EOF'
          import sqlite3
          from pathlib import Path
          db = Path("data/mundial2026.db")
          if not db.exists():
              print("DB no encontrada"); exit()
          conn = sqlite3.connect(db)
          tables = [
              "teams","players","squad_selections","wc26_squad",
              "projected_lineups","team_matches","player_club_stats",
              "player_nat_stats","player_ratings","match_lineups","wc_matches",
          ]
          print("\n=== Estado DB ===")
          for t in tables:
              try:
                  c = conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                  print(f"  {t:<25}: {c:>6}")
              except Exception:
                  print(f"  {t:<25}: tabla ausente")
          conn.close()
          EOF

      - name: Map WC fixture IDs (api_fixture_id en wc_matches)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/map_wc_fixtures.py || echo "Fixture mapping done"

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "mundial-bot"
          git config user.email "bot@mundial2026.local"
          git config commit.gpgsign false
          git add data/mundial2026.db
          git add data/lineups/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios en DB — nada que commitear"
            exit 0
          fi
          SCOPE="${{ steps.scope.outputs.scope }}"
          FECHA=$(date +'%Y-%m-%d %H:%M UTC')
          git commit -m "data: auto-update [${SCOPE}] ${FECHA}"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || git rebase --abort
          git push -u origin "HEAD:$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
