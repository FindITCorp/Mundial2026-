name: Daily Model Recalibration

# ─────────────────────────────────────────────────────────────────────────────
# Ciclo de mejora continua diaria:
#   0. Obtener predicciones externas (Football Prediction API / RapidAPI)
#   1. Predecir los próximos partidos (guardar en match_predictions)
#   2. Evaluar predicciones previas vs resultados reales → detectar sesgos
#   3. Recalibrar team_avgs con peso por calidad de rival
#   4. Actualizar Elo con resultados WC reales
#   5. Refrescar ratings de jugadores
#   6. Commitar DB actualizada
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 8 * * *'   # 8am UTC diario
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Mostrar reporte detallado de evaluación'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── FASE 0: Football Prediction API — señal de mercado externa ──────
      - name: Fetch external predictions (Football Prediction API / RapidAPI)
        run: |
          cd $GITHUB_WORKSPACE
          python3 -c "
          import sys, os
          sys.path.insert(0, '.')
          try:
              from pipelines.fetch_predictions import fetch_predictions_by_date, save_predictions_to_db
              from datetime import datetime, timedelta
              today = datetime.utcnow()
              saved_total = 0
              for days_ahead in range(0, 5):
                  iso = (today + timedelta(days=days_ahead)).strftime('%Y-%m-%d')
                  for fed in ['FIFA', 'UEFA', 'CONMEBOL', 'CAF', 'AFC']:
                      preds = fetch_predictions_by_date(iso, fed)
                      if preds:
                          saved_total += save_predictions_to_db(preds)
              print(f'External predictions guardadas: {saved_total}')
          except Exception as e:
              print(f'fetch_predictions skipped: {e}')
          "
        env:
          APIFOOT: ${{ secrets.APIFOOT }}

      # ── FASE 0b: Sincronizar resultados varados + refit sesgo confederación ──
      - name: Sync stranded results (team_matches → wc_matches) + confed bias refit
        run: |
          cd $GITHUB_WORKSPACE
          python3 -c "
          import sys, sqlite3
          sys.path.insert(0, '.')
          try:
              from scripts.sync_friendly_results import sync
              conn = sqlite3.connect('data/mundial2026.db')
              n = sync(conn); conn.commit(); conn.close()
              print(f'sync_friendly_results: {n} resultados')
          except Exception as e:
              print(f'sync skipped: {e}')
          try:
              import subprocess
              subprocess.run(['python3', 'scripts/fit_confederation_bias.py'], check=False)
          except Exception as e:
              print(f'confed fit skipped: {e}')
          try:
              from scripts.sync_confirmed_xi import sync as xi_sync
              conn = sqlite3.connect('data/mundial2026.db')
              n = xi_sync(conn); conn.commit(); conn.close()
              print(f'sync_confirmed_xi: {n} equipos')
          except Exception as e:
              print(f'sync_confirmed_xi skipped: {e}')
          try:
              import subprocess as sp
              sp.run(['python3', 'scripts/fix_stats_links.py'], check=False)
          except Exception as e:
              print(f'fix_stats_links skipped: {e}')
          try:
              import subprocess as sp2
              sp2.run(['python3', 'scripts/team_strengths.py'], check=False)
          except Exception as e:
              print(f'team_strengths skipped: {e}')
          try:
              from scripts.sync_player_match_ratings import sync as pr_sync
              conn = sqlite3.connect('data/mundial2026.db')
              pr_sync(conn); conn.commit(); conn.close()
          except Exception as e:
              print(f'sync_player_match_ratings skipped: {e}')
          "

      # ── FASE 1: Predecir partidos de los próximos 3 días ─────────────────
      - name: Predict upcoming matches
        run: |
          cd $GITHUB_WORKSPACE
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from scripts.predict_upcoming import store_predictions
              store_predictions(days_ahead=3)
          except Exception as e:
              print(f'predict_upcoming skipped: {e}')
          "

      # ── FASE 2: Evaluar predicciones anteriores vs resultados reales ─────
      - name: Evaluate model — predictions vs real results
        run: |
          cd $GITHUB_WORKSPACE
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from scripts.evaluate_model import evaluate
              summary = evaluate(verbose=True)
              if summary:
                  acc = summary.get('accuracy', 0) * 100
                  brier = summary.get('avg_brier', 0)
                  scale = summary.get('lambda_scale', 1.0)
                  notes = summary.get('notes', [])
                  print(f'Accuracy: {acc:.1f}% | Brier: {brier:.4f} | λ-scale: {scale:.3f}')
                  if notes:
                      print('Patrones:', ' | '.join(notes))
          except Exception as e:
              print(f'evaluate_model skipped: {e}')
          "

      # ── FASE 2b: Capturar amistosos recientes de selecciones WC ─────────
      - name: Fetch recent WC team friendlies (api-sports.io)
        run: |
          cd $GITHUB_WORKSPACE
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from pipelines.update_wc import fetch_recent_friendlies
              n = fetch_recent_friendlies(days_back=14)
              print(f'Amistosos guardados: {n}')
          except Exception as e:
              print(f'fetch_recent_friendlies skipped: {e}')
          "
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

      # ── FASE 3: Recalibrar team averages con modelo de calidad rival ─────
      - name: Refresh team averages (opponent-quality weighting)
        run: |
          cd $GITHUB_WORKSPACE
          python3 scripts/refresh_team_avgs.py

      # ── FASE 4: Actualizar Elo con resultados WC ─────────────────────────
      - name: Auto-calibrate Elo from WC results
        run: |
          cd $GITHUB_WORKSPACE
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from scripts.auto_calibrate_wc import calibrate
              calibrate()
          except Exception as e:
              print(f'auto_calibrate_wc skipped: {e}')
          "

      # ── FASE 5: Refrescar ratings de jugadores ───────────────────────────
      - name: Refresh player ratings
        run: |
          cd $GITHUB_WORKSPACE
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from models.player_rating import PlayerRatingEngine
              engine = PlayerRatingEngine('data/mundial2026.db')
              engine.compute_all_ratings()
              print('Player ratings updated.')
          except Exception as e:
              print(f'player_rating skipped: {e}')
          "

      # ── FASE 6: Commitar DB actualizada ──────────────────────────────────
      - name: Commit DB and scripts changes
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          # Guardar DB recalibrada antes de sincronizar con remoto
          cp data/mundial2026.db /tmp/recalibrated.db

          # Sincronizar con remoto (evita conflictos de archivo binario)
          git fetch origin main
          git reset --hard origin/main

          # Aplicar DB recalibrada encima del remoto actualizado
          cp /tmp/recalibrated.db data/mundial2026.db
          git add data/mundial2026.db

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily: recalibrate + evaluate model $(date -u +%Y-%m-%d)"
            git push origin main
            echo "DB pushed to main."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
