name: Completar convocados y stats de partidos

on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Fechas a procesar ej: 2026-06-15,2026-06-16 (vacio = hoy + ayer)'
        required: false
        type: string
      fix_squads:
        description: 'Completar convocados incompletos'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  schedule:
    - cron: '0 6 * 6 *'
    - cron: '0 6 * 7 *'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Crear directorios
        run: mkdir -p data/lineups data/cache/api_football data/logs

      - name: Completar convocados incompletos
        if: inputs.fix_squads != 'false'
        run: python scripts/apisports_fix_squads.py

      - name: Fetchear stats de partidos WC recientes
        run: python scripts/apisports_fetch_match_stats.py "${{ inputs.dates }}"

      - name: Recalibrar modelo
        run: |
          python scripts/fix_stats_links.py        || true
          python scripts/team_strengths.py          || true
          python scripts/fit_confederation_bias.py  || true
          python scripts/sync_player_match_ratings.py || true
          python -c "
          import sys; sys.path.insert(0,'.')
          from scripts.predict_upcoming import store_predictions
          store_predictions(days_ahead=4)
          print('predict_upcoming OK')
          " || true

      - name: Resumen de cobertura
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('data/mundial2026.db')
          incompletos = conn.execute('''
              SELECT t.name, COUNT(pl.player_id) as n
              FROM teams t
              LEFT JOIN projected_lineups pl ON pl.team_id = t.id
              WHERE t.id IN (
                  SELECT home_team_id FROM wc_matches WHERE date >= '2026-06-11'
                  UNION SELECT away_team_id FROM wc_matches WHERE date >= '2026-06-11'
              )
              GROUP BY t.id, t.name HAVING n < 23 ORDER BY n
          ''').fetchall()
          if incompletos:
              print('Equipos aun incompletos:')
              for n,c in incompletos: print(f'  {n}: {c}')
          else:
              print('Todos los 48 equipos tienen 23+ convocados.')
          sin_stats = conn.execute('''
              SELECT w.date, w.home_team_name, w.away_team_name
              FROM wc_matches w
              WHERE w.date >= '2026-06-11' AND w.played=1
                AND (SELECT COUNT(*) FROM match_player_stats
                     WHERE home_team_id=w.home_team_id AND match_date=w.date) < 10
              ORDER BY w.date
          ''').fetchall()
          if sin_stats:
              print(f'Partidos sin player stats ({len(sin_stats)}):')
              for d,h,a in sin_stats: print(f'  {d}: {h} vs {a}')
          else:
              print('Todos los partidos jugados tienen player stats.')
          conn.close()
          "

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          cp data/mundial2026.db /tmp/fixed.db
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/fixed.db data/mundial2026.db
          git add data/mundial2026.db
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "data: squads + stats $(date -u +%Y-%m-%d)"
            git push origin main
            echo "Pusheado."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
