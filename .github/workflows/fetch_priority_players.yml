name: Fetch Priority Player Stats (First Matches)

on:
  workflow_dispatch:
    inputs:
      teams:
        description: 'Teams comma-separated (leave empty for first match teams Jun 11-15)'
        required: false
        default: ''

jobs:
  fetch-priority:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p data/cache/club_stats data/logs

      - name: Test API connectivity
        env:
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          python - <<'PYEOF'
          import os, requests

          apisports_key = os.getenv('APISPORTS_KEY', '')
          apifoot_key   = os.getenv('APIFOOT', '')

          print(f"APISPORTS_KEY set: {bool(apisports_key)} ({apisports_key[:6]}...)" if apisports_key else "APISPORTS_KEY: NOT SET")
          print(f"APIFOOT set: {bool(apifoot_key)} ({apifoot_key[:6]}...)" if apifoot_key else "APIFOOT: NOT SET")
          print()

          # Test 1: direct api-sports.io
          if apisports_key:
              try:
                  r = requests.get('https://v3.football.api-sports.io/players',
                      headers={'x-apisports-key': apisports_key},
                      params={'search': 'Mbappe', 'season': 2024}, timeout=15)
                  print(f"Direct api-sports: HTTP {r.status_code} — {r.text[:120]}")
              except Exception as e:
                  print(f"Direct api-sports ERROR: {e}")

          # Test 2: RapidAPI
          if apifoot_key:
              try:
                  r = requests.get('https://api-football-v1.p.rapidapi.com/v3/players',
                      headers={'x-rapidapi-host': 'api-football-v1.p.rapidapi.com',
                               'x-rapidapi-key': apifoot_key},
                      params={'search': 'Mbappe', 'season': 2024}, timeout=15)
                  print(f"RapidAPI: HTTP {r.status_code} — {r.text[:120]}")
              except Exception as e:
                  print(f"RapidAPI ERROR: {e}")
          PYEOF

      - name: Setup database
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: python scripts/setup_db.py

      - name: Fetch club stats for priority teams
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          APIFOOT: ${{ secrets.APIFOOT }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          INPUT_TEAMS: ${{ github.event.inputs.teams }}
        run: |
          python - <<'PYEOF'
          import sys, os
          sys.path.insert(0, '.')

          try:
              from pipelines.fetch_club_stats import run as run_club_stats
          except Exception as e:
              print(f"Import error: {e}")
              import traceback; traceback.print_exc()
              sys.exit(1)

          DEFAULT_PRIORITY = [
              # Group A: Mexico, South Africa, South Korea, Czechia
              'Mexico', 'South Korea',
              # Group B: Canada, Bosnia and Herzegovina, Qatar, Switzerland
              'Switzerland', 'Canada',
              # Group C: Brazil, Morocco, Scotland, Haiti
              'Brazil', 'Morocco',
              # Group D: USA, Paraguay, Australia, Turkey
              'USA', 'Turkey',
              # Group E: Germany, Curacao, Ivory Coast, Ecuador
              'Germany', 'Ecuador',
              # Group F: Netherlands, Japan, Sweden, Tunisia
              'Netherlands', 'Japan',
              # Group G: Belgium, Egypt, Iran, New Zealand
              'Belgium', 'Iran',
              # Group H: Spain, Cape Verde, Saudi Arabia, Uruguay
              'Spain', 'Uruguay',
              # Group I: France, Senegal, Iraq, Norway
              'France', 'Senegal',
              # Group J: Argentina, Algeria, Austria, Jordan
              'Argentina',
              # Group K: Portugal, DR Congo, Uzbekistan, Colombia
              'Portugal', 'Colombia',
              # Group L: England, Croatia, Ghana, Panama
              'England', 'Croatia', 'Ghana',
          ]

          custom = os.getenv('INPUT_TEAMS', '').strip()
          teams = [t.strip() for t in custom.split(',') if t.strip()] if custom else DEFAULT_PRIORITY

          print(f"Processing {len(teams)} priority teams")
          print(f"Teams: {teams}")
          run_club_stats(teams=teams, force_refresh=True)
          PYEOF

      - name: DB summary
        if: always()
        run: |
          python - <<'PYEOF'
          import sqlite3
          from pathlib import Path
          db = Path('data/mundial2026.db')
          if not db.exists():
              print("DB not found"); exit()
          conn = sqlite3.connect(db)
          total = conn.execute('SELECT COUNT(*) FROM player_club_stats').fetchone()[0]
          real  = conn.execute('SELECT COUNT(*) FROM player_club_stats WHERE xg > 0').fetchone()[0]
          synth = conn.execute('SELECT COUNT(*) FROM player_club_stats WHERE xg = 0').fetchone()[0]
          print(f'Total: {total} | Con xG real: {real} | Sinteticos: {synth}')
          rows = conn.execute('''
              SELECT p.name, t.name, pcs.goals, pcs.assists, pcs.xg
              FROM player_club_stats pcs
              JOIN players p ON p.id = pcs.player_id
              JOIN teams t ON t.id = p.team_id
              WHERE pcs.xg > 0
              ORDER BY pcs.xg DESC LIMIT 10
          ''').fetchall()
          if rows:
              print('Top jugadores por xG:')
              for r in rows:
                  print(f'  {r[0]:<25} ({r[1]:<12}) G:{r[2]} A:{r[3]} xG:{r[4]:.2f}')
          conn.close()
          PYEOF

      - name: Commit updated player data
        run: |
          git config user.name "mundial-bot"
          git config user.email "bot@mundial2026.local"
          git add data/mundial2026.db
          git diff --staged --quiet && echo "Sin cambios en DB" && exit 0
          git -c commit.gpgsign=false commit -m "data: priority player stats (xG real) $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push -u origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
