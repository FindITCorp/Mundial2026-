name: Discover Live Football API Data

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe API and save responses
        run: python3 scripts/probe_live_api.py
        env:
          APIFOOT: ${{ secrets.APIFOOT }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          ls -lh scripts/api_probe_results.json 2>/dev/null || echo "WARNING: probe file not created"
          git add -f scripts/api_probe_results.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: API probe $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push -u origin main || true
