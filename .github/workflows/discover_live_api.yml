name: Discover Live Football API Data

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe API with curl and save raw responses
        run: |
          mkdir -p data
          KEY="${APIFOOT}"
          HOST="free-api-live-football-data.p.rapidapi.com"
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)

          echo "=== Testing API key presence ==="
          echo "Key length: ${#KEY}"
          echo "Today: $TODAY / Yesterday: $YESTERDAY"

          call_api() {
            local label="$1"
            local path="$2"
            local params="$3"
            local url="https://${HOST}${path}"
            [ -n "$params" ] && url="${url}?${params}"
            echo -e "\n--- $label ---"
            echo "URL: $url"
            HTTP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
              -H "x-rapidapi-host: ${HOST}" \
              -H "x-rapidapi-key: ${KEY}" \
              "$url")
            STATUS=$(echo "$HTTP" | grep "HTTP_STATUS:" | cut -d: -f2)
            BODY=$(echo "$HTTP" | grep -v "HTTP_STATUS:")
            echo "HTTP $STATUS"
            echo "$BODY" | head -20
            echo "$BODY" > "data/probe_${label}.json"
          }

          call_api "leagues"       "/football-get-all-leagues"                       ""
          sleep 0.5
          call_api "livescores"    "/football-get-all-livescores"                    ""
          sleep 0.5
          call_api "fixtures_today"  "/football-get-fixtures-scores-by-date"  "date=${TODAY}"
          sleep 0.5
          call_api "fixtures_yest"   "/football-get-fixtures-scores-by-date"  "date=${YESTERDAY}"
          sleep 0.5
          call_api "search_brazil"   "/football-search-teams"                 "searchQuery=Brazil"
          sleep 0.5
          call_api "search_mbappe"   "/football-search-players"               "searchQuery=Mbappe"
          sleep 0.5
          call_api "search_arg"      "/football-search-teams"                 "searchQuery=Argentina"

          echo -e "\n=== All probe files ==="
          ls -lh data/probe_*.json 2>/dev/null || echo "No probe files created"
        env:
          APIFOOT: ${{ secrets.APIFOOT }}

      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git add data/probe_*.json 2>/dev/null || true
          git diff --cached --quiet && echo "No probe data to commit" && exit 0
          git commit -m "chore: API probe results $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || git rebase --abort
          git push -u origin main
